# Fluentd Configuration for Zylin AI
# Collects logs from all Docker containers and forwards to Elasticsearch

<source>
  @type forward
  @id forward_input
  port 24224
  bind 0.0.0.0
</source>

# Backend service logs
<source>
  @type tail
  @id backend_logs
  path /var/log/containers/backend/*.log
  pos_file /var/log/fluentd/backend.pos
  tag backend
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

# Agent service logs
<source>
  @type tail
  @id agent_logs
  path /var/log/containers/agent/*.log
  pos_file /var/log/fluentd/agent.pos
  tag agent
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

# Nginx access logs
<source>
  @type tail
  @id nginx_access
  path /var/log/nginx/access.log
  pos_file /var/log/fluentd/nginx-access.pos
  tag nginx.access
  <parse>
    @type nginx
  </parse>
</source>

# Nginx error logs
<source>
  @type tail
  @id nginx_error
  path /var/log/nginx/error.log
  pos_file /var/log/fluentd/nginx-error.pos
  tag nginx.error
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+ [^ ]+) \[(?<log_level>\w+)\] (?<pid>\d+).(?<tid>[^:]+): (?<message>.*)$/
    time_format %Y/%m/%d %H:%M:%S
  </parse>
</source>

# PostgreSQL logs
<source>
  @type tail
  @id postgres_logs
  path /var/log/postgresql/*.log
  pos_file /var/log/fluentd/postgres.pos
  tag postgres
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+ [^ ]+ [^ ]+) (?<log_level>\w+):  (?<message>.*)$/
    time_format %Y-%m-%d %H:%M:%S.%L %Z
  </parse>
</source>

# Redis logs
<source>
  @type tail
  @id redis_logs
  path /var/log/redis/*.log
  pos_file /var/log/fluentd/redis.pos
  tag redis
  <parse>
    @type regexp
    expression /^(?<pid>\d+):(?<role>\w+) (?<time>[^ ]+ [^ ]+) (?<log_level>[^ ]) (?<message>.*)$/
    time_format %d %b %Y %H:%M:%S.%L
  </parse>
</source>

# Add common fields to all logs
<filter **>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "${ENVIRONMENT}"
    service_name ${tag}
  </record>
</filter>

# Parse and enrich backend logs
<filter backend>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Parse and enrich agent logs
<filter agent>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Detect and tag error logs
<filter **>
  @type grep
  <regexp>
    key log_level
    pattern /(ERROR|CRITICAL|FATAL|error|critical|fatal)/
  </regexp>
  <exclude>
    key message
    pattern /health check/
  </exclude>
</filter>

# Add severity levels
<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    severity ${record["log_level"].to_s.upcase}
    is_error ${record["log_level"].to_s =~ /(ERROR|CRITICAL|FATAL)/ ? true : false}
  </record>
</filter>

# Elasticsearch output (primary)
<match **>
  @type elasticsearch
  @id elasticsearch_output
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix zylin
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  
  # Buffer configuration
  <buffer>
    @type file
    path /var/log/fluentd/buffer/elasticsearch
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    retry_type exponential_backoff
    retry_wait 10s
    retry_max_interval 300s
    retry_timeout 72h
    overflow_action drop_oldest_chunk
  </buffer>
  
  # Connection settings
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
</match>

# Stdout output for debugging (optional)
<match debug.**>
  @type stdout
  @id stdout_output
</match>

# Copy error logs to separate index
<match **.error>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix zylin-errors
    logstash_dateformat %Y.%m.%d
  </store>
  <store>
    @type file
    path /var/log/fluentd/errors/error.log
    compress gzip
    <buffer>
      timekey 1d
      timekey_wait 10m
    </buffer>
  </store>
</match>
