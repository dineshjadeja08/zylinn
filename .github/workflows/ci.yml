name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
    
    - name: Run Black (format check)
      run: |
        black --check agent/ backend/ tests/ || true
    
    - name: Run Flake8 (style check)
      run: |
        flake8 agent/ backend/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 agent/ backend/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-agent:
    name: Test Agent
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-agent-${{ hashFiles('agent/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-backend-${{ hashFiles('backend/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run backend tests
      run: |
        pytest tests/unit/test_adapters.py::TestDatabaseModels -v
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: sqlite:///./test.db

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-agent, test-backend]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt
        pip install -r backend/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: sqlite:///./test_integration.db
        STT_PROVIDER: mock
        TTS_PROVIDER: mock
        OPENAI_API_KEY: mock-key-for-testing
    
    - name: Run simulation script
      run: |
        cd agent/scripts
        chmod +x simulate-audio-call.sh
        ./simulate-audio-call.sh || echo "Simulation completed"
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: sqlite:///./test_simulation.db

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-agent, test-backend]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt
        pip install -r backend/requirements.txt
        pip install -r tests/requirements.txt
        pip install pytest-cov
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=agent --cov=backend --cov-report=xml --cov-report=html
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: sqlite:///./test_coverage.db
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [integration-test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Agent Docker Image
      run: |
        cd agent
        docker build -t zylin-agent:${{ github.sha }} .
    
    - name: Build Backend Docker Image
      run: |
        cd backend
        docker build -t zylin-backend:${{ github.sha }} .
    
    - name: Test Agent Container
      run: |
        docker run --rm zylin-agent:${{ github.sha }} python -c "import agent; print('Agent module loaded successfully')"
    
    - name: Test Backend Container
      run: |
        docker run --rm zylin-backend:${{ github.sha }} python -c "import app; print('Backend module loaded successfully')"

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [integration-test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt
        pip install -r backend/requirements.txt
        pip install -r tests/requirements.txt
    
    - name: Acceptance Test 1 - Backend starts
      run: |
        cd backend
        timeout 10s python app.py &
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        echo "✅ Backend starts successfully"
      env:
        DATABASE_URL: sqlite:///./test_acceptance.db
        BACKEND_PORT: 8000
    
    - name: Acceptance Test 2 - Simulation produces DB records
      run: |
        cd agent/scripts
        chmod +x simulate-audio-call.sh
        ./simulate-audio-call.sh
        
        # Verify database has records
        python -c "
import sys
sys.path.insert(0, '../../backend')
from models import DatabaseManager, get_call_transcripts, get_call_replies
db = DatabaseManager('sqlite:///./zylin.db')
session = db.get_session()
# Get latest call
from models import CallRecord
call = session.query(CallRecord).order_by(CallRecord.created_at.desc()).first()
if call:
    transcripts = get_call_transcripts(session, call.call_id, final_only=True)
    replies = get_call_replies(session, call.call_id)
    assert len(transcripts) > 0, 'No transcripts found'
    assert len(replies) > 0, 'No replies found'
    print(f'✅ Found {len(transcripts)} transcripts and {len(replies)} replies')
else:
    raise Exception('No call record found')
session.close()
        "
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: sqlite:///./zylin.db
    
    - name: Acceptance Test 3 - Unit tests pass
      run: |
        pytest tests/unit/ -v
        echo "✅ All unit tests pass"
      env:
        PYTHONPATH: ${{ github.workspace }}

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, integration-test, acceptance-tests, build-docker]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        if [ "${{ needs.lint.result }}" == "success" ] && \
           [ "${{ needs.integration-test.result }}" == "success" ] && \
           [ "${{ needs.acceptance-tests.result }}" == "success" ] && \
           [ "${{ needs.build-docker.result }}" == "success" ]; then
          echo "✅ All CI checks passed!"
          exit 0
        else
          echo "❌ Some CI checks failed"
          exit 1
        fi
